version: '3.9'

volumes:
  db:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/acosgun/datam/mariadb

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  credentials:
    file: ../secrets/credentials.txt

services:  
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    volumes:
      - db:/var/lib/mysql
    secrets:
      - db_password
      - db_root_password
      - credentials
    restart: always
    expose:
      - 3306
    networks:
      - inception_net
    env_file:
      - .env

networks:
  inception_net:
    driver: bridge
