services:
  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    expose:
      - 3306
    networks:
      - net
    volumes:
      - db_volume:/var/lib/mysql
    env_file:
      - .env
    secrets:
      - db_password
      - db_root_password
      - credentials
    restart: always

  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress
    expose:
      - 9000
    networks:
      - net
    volumes:
      - wp_volume:/var/www/html
    env_file:
      - .env
    secrets:
      - credentials
      - db_password
    depends_on:
      - mariadb
    restart: always

  nginx:
    container_name: nginx
    build: ./requirements/nginx
    expose:
      - 443
    networks:
      - net
    ports:
      - "443:443"
    volumes:
      - wp_volume:/var/www/html
    env_file:
      - .env
    secrets:
      - credentials
    depends_on:
      - mariadb
      - wordpress
    restart: always

networks:
  net:
    name: net
    driver: bridge

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  credentials:
    file: ../secrets/credentials.txt

volumes:
  db_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/acosgun/data/mariadb

  wp_volume:
    driver : local
    driver_opts:
      type: none
      o: bind
      device: /home/acosgun/data/wordpress
