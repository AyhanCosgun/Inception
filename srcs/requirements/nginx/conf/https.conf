server
{
    listen       443 ssl;
    listen       [::]:443 ssl;
    server_name  $DOMAIN_NAME;

    ssl_certificate_key !CERT_KEY_PLACEHOLDER!;
    ssl_certificate !CERT_PATH_PLACEHOLDER!;
    ssl_protocols TLSv1.2 TLSv1.3;

    root   /var/www/html;
    index  index.php;

    location ~ \.php$
    {
        include snippets/fastcgi-php.conf;
        fastcgi_pass wordpress:9000;
    }
}
